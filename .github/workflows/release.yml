# AutoConditionTrade — 자동 빌드 & 릴리즈
#
# 사용법:
#   git tag v1.0.0 && git push origin v1.0.0
#
# 결과:
#   - Windows: .msi / NSIS .exe 설치 파일
#   - macOS:   Universal .dmg (Apple Silicon + Intel)
#   - GitHub Releases에 드래프트로 생성됨 → 확인 후 Publish

name: Release

on:
  push:
    tags:
      # v숫자.숫자.숫자 형식의 태그만 트리거
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  dependency-security:
    uses: ./.github/workflows/security.yml

  database-contract:
    needs: [release-gate, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tauri Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: PostgreSQL 16 storage, verified TLS and restart contracts
        run: npm run test:database-tls-contract
      - name: Upload database contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-contract-results
          path: .cache/database-tls-contract/*/result.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  build-tauri:
    needs: database-contract
    permissions:
      contents: write   # 릴리즈 업로드에 필요
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ─────────────────────────────────────────────
          - platform: windows-latest
            rust-targets: ''
            tauri-args: ''

          # ── macOS Universal (Apple Silicon + Intel) ─────────────
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      # ── 소스 체크아웃 ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js 설정 ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Rust 툴체인 설정 ──────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # ── Rust 빌드 캐시 ────────────────────────────────────────
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── macOS 전용: pkg-config (일부 크레이트에 필요) ─────────
      - name: Install pkg-config (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install pkg-config

      # ── npm 의존성 설치 ───────────────────────────────────────
      - name: Install frontend dependencies (locked)
        run: npm ci --ignore-scripts

      # ── Tauri 빌드 & 릴리즈 업로드 ───────────────────────────
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KISAutoTrade ${{ github.ref_name }}'
          releaseBody: |
            ## 변경 사항

            <!-- 릴리즈 노트를 여기에 작성하세요 -->

            ## 설치 파일

            | 플랫폼 | 파일 |
            |--------|------|
            | Windows | `.msi` 또는 NSIS `.exe` |
            | macOS   | Universal `.dmg` (Apple Silicon + Intel) |

            ## 주의 사항

            - **모의투자**로 먼저 충분히 검증 후 실전 계좌에 사용하세요.
            - `secure_config.json` 파일은 직접 생성해야 합니다 (`secure_config.example.json` 참고).
            - KIS API 키는 앱 실행 후 Settings에서 등록합니다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}

  release-integrity:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUIRE_RELEASE_SIGNATURES: ${{ vars.REQUIRE_RELEASE_SIGNATURES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download draft release assets
        run: gh release download "${GITHUB_REF_NAME}" --dir release-assets
      - name: Verify artifacts and create checksums
        shell: bash
        run: |
          args=(--dir release-assets)
          if [[ "${REQUIRE_RELEASE_SIGNATURES}" == "true" ]]; then
            args+=(--require-signatures)
          fi
          npm run verify:release-artifacts -- "${args[@]}"
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Upload integrity metadata
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS release-assets/release-artifacts.json --clobber
